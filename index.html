<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#252729" />
  <meta name="description" content="Booyah. A scene that moves with your perspective." />
  <title>Booyah</title>
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
</head>
<body>
  <main class="stage-shell" id="stage-shell" aria-label="Booyah 3D scene">
    <div id="scene" aria-label="Interactive 3D scene. Enable head tracking or move the pointer to look around." role="img"></div>
    <aside class="controls" aria-label="Head tracking controls">
      <button class="camera-button" id="camera-toggle" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="6" width="12" height="12" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="m15 10 6-3v10l-6-3" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>Enable head tracking</span><i class="tracking-dot" aria-hidden="true"></i>
      </button>
      <div class="sliders">
        <div class="slider-control"><label for="gain">Movement <output id="gain-output" for="gain">1.0×</output></label><input id="gain" type="range" min="0.5" max="2" step="0.1" value="1" /></div>
        <div class="slider-control"><label for="smoothing">Smoothing <output id="smoothing-output" for="smoothing">20%</output></label><input id="smoothing" type="range" min="0" max="100" value="20" /></div>
        <div class="slider-control"><label for="distance">Distance <output id="distance-output" for="distance">100 cm</output></label><input id="distance" type="range" min="25" max="150" value="100" title="Your distance from the screen in centimeters" /></div>
        <div class="slider-control"><label for="screen-width">View width <output id="screen-width-output" for="screen-width">35 cm</output></label><input id="screen-width" type="range" min="15" max="120" value="35" title="Measure the visible scene from left to right in centimeters, excluding the browser sidebar" /></div>
      </div>
    </aside>
    <div class="stage-tools" aria-label="View controls">
      <button class="icon-button" id="reset-view" title="Reset view and recenter head tracking" aria-label="Reset view and recenter head tracking"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10a8 8 0 1 1 .7 6M4 4v6h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-button" id="fullscreen" title="Full screen" aria-label="Enter full screen"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="toast" id="status-message" role="status" aria-live="polite" hidden></div>
    <div class="scene-error" id="scene-error" role="alert" hidden></div>
    <div class="drop-overlay" id="drop-overlay">Drop your .glb model</div>
    <div id="camera-preview" class="camera-preview" hidden>
      <video id="webcam" class="tracking-video" autoplay playsinline muted aria-label="Live camera preview" tabindex="-1"></video>
    </div>
    <dialog id="tracking-prompt" class="tracking-prompt" aria-labelledby="tracking-prompt-title" aria-describedby="tracking-prompt-description">
      <h1 id="tracking-prompt-title">Enable head tracking?</h1>
      <p id="tracking-prompt-description">Move your head to look around the room. Your camera feed stays on your device.</p>
      <div class="prompt-actions">
        <button id="prompt-enable" class="prompt-enable" type="button" autofocus>Enable head tracking</button>
        <button id="prompt-skip" class="prompt-skip" type="button">Not now</button>
      </div>
    </dialog>
    <input id="model-file" type="file" accept=".glb" hidden />
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
